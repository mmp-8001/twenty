<!doctype html>
<html lang="en" translate="no" class="light">
  <head>
    <meta charset="UTF-8" />

    <link
      rel="icon"
      type="image/x-icon"
      href="/images/icons/android/android-launchericon-48-48.png"
      data-rh="true"
    />
    <link rel="apple-touch-icon" href="/images/icons/ios/192.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A modern open-source CRM" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />
    <meta property="og:description" content="A modern open-source CRM" />
    <meta property="og:title" content="Twenty" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/twentyhq/twenty/main/docs/static/img/social-card.png"
    />

    <meta name="twitter:description" content="A modern open-source CRM" />
    <meta name="twitter:title" content="Twenty" />
    <title>Twenty</title>
    <script>
      // Set dir/lang before the bundle loads so an RTL locale doesn't get a
      // left-to-right first paint. Mirrors the resolution order in
      // initialI18nActivate and the RTL list in getLocaleTextDirection
      // (twenty-shared), which stay the source of truth after boot.
      (function () {
        try {
          var RTL_LANGUAGES = [
            'ar',
            'dv',
            'fa',
            'he',
            'ps',
            'sd',
            'ug',
            'ur',
            'yi',
          ];
          var locale =
            new URLSearchParams(window.location.search).get('locale') ||
            window.localStorage.getItem('locale') ||
            window.navigator.language;
          if (locale) {
            document.documentElement.lang = locale;
            document.documentElement.dir =
              RTL_LANGUAGES.indexOf(locale.split(/[-_]/)[0].toLowerCase()) !==
              -1
                ? 'rtl'
                : 'ltr';
          }
        } catch (error) {
          // dir/lang are reconciled by dynamicActivate once the bundle runs.
        }
      })();
    </script>
    <!-- BEGIN: Twenty Config -->
    <script id="twenty-env-config">
      window._env_ = {
        // This will be overwritten
      };
    </script>
    <!-- END: Twenty Config -->

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <script type="module">
      const disableInputAutoZoom = () => {
        const viewportMetadata = document.querySelector('meta[name=viewport]');

        if (viewportMetadata !== null) {
          viewportMetadata.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, interactive-widget=resizes-content',
          );
        }
      };

      const isIOS = /iPad|iPhone/.test(navigator.userAgent);
      if (isIOS) {
        disableInputAutoZoom();
      }
    </script>
    <style>
      :root {
        /* THEME_DARK.background.secondary */
        --theme-dark-background-secondary: #1b1b1b;
        /* THEME_LIGHT.background.secondary */
        --theme-light-background-secondary: #fcfcfc;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: var(--theme-dark-background-secondary);
        }
      }

      @media (prefers-color-scheme: light) {
        html,
        body {
          background-color: var(--theme-light-background-secondary);
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
